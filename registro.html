<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - TurnoFácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="navbar">
                <a href="index.html" class="logo">TurnoFacil</a>
                <ul class="linksNavbar">
                    <li><a href="index.html#inicio">Inicio</a></li>
                    <li><a href="index.html#servicios">Servicios</a></li>
                    <li><a href="index.html#reservar">Reservar</a></li>
                    <li><a href="index.html#horarios">Horarios</a></li>
                    <li><a href="login.html">Iniciar sesion</a></li>
                    <li><a href="registro.html" class="btn btn-secondary btnNavbar">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <div class="encabezadoSeccionCentro">
                <span class="subtitulo">Bienvenido</span>
                <h2>Crear cuenta</h2>
                <p class="texto-gris">Registrate para reservar y gestionar tus citas.</p>
            </div>

            <div class="formContainer">
                <div id="alertaError" class="alertaError"></div>
                <div id="alertaExito" class="alertaExito"></div>

                <form id="formRegistro" novalidate>

                    <div class="campoForm">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" placeholder="Tu nombre y apellidos" aria-describedby="errorNombre">
                        <span id="errorNombre" class="errorCampo"></span>
                    </div>

                    <div class="campoForm">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" placeholder="correo@ejemplo.com" aria-describedby="errorCorreo">
                        <span id="errorCorreo" class="errorCampo"></span>
                    </div>

                    <div class="campoForm">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" placeholder="8888-8888" aria-describedby="errorTelefono">
                        <span id="errorTelefono" class="errorCampo"></span>
                    </div>

                    <div class="campoForm">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" placeholder="Mínimo 8 caracteres, con letras y números" aria-describedby="errorContrasena">
                        <span id="errorContrasena" class="errorCampo"></span>
                    </div>

                    <div class="campoForm">
                        <label for="confirmarContrasena">Confirmar contraseña</label>
                        <input type="password" id="confirmarContrasena" placeholder="Repetí la contraseña" aria-describedby="errorConfirmarContrasena">
                        <span id="errorConfirmarContrasena" class="errorCampo"></span>
                    </div>

                    <button type="submit" class="btn btn-primary btnReserva">Crear cuenta</button>

                </form>

                <p class="enlaceForm">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 TurnoFacil - Sistema de reservacion de citas. SC-502 Ambiente Web.</p>
        </div>
    </footer>

    <script src="registro.js"></script>
</body>
</html>
